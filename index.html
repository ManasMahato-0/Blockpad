<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A block-based document editor built from scratch with React and TypeScript." />
    <title>Blockpad</title>
    <!-- Picks the saved or system theme before the first paint, so a dark-mode
         visitor never sees a white flash. Mirrors the rule in src/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("blockpad:theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
